<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>شاصيها | تسجيل دخول الإدارة</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

font-family:'Cairo',sans-serif;
background:#0f172a;
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
padding:20px;

}

.box{

background:#fff;
width:100%;
max-width:380px;
padding:30px 25px;
border-radius:18px;
box-shadow:0 10px 30px rgba(0,0,0,.3);

}

h1{

text-align:center;
font-size:22px;
color:#0f172a;
margin-bottom:6px;

}

.hint{

text-align:center;
font-size:12px;
color:#777;
margin-bottom:20px;

}

label{

display:block;
font-size:13px;
font-weight:700;
margin-bottom:4px;
margin-top:12px;
}

input{

width:100%;
padding:10px 12px;
border:1px solid #ccc;
border-radius:8px;
font-family:'Cairo',sans-serif;
font-size:14px;
outline:none;

}

input:focus{

border-color:#f97316;

}

button{

width:100%;
margin-top:20px;
padding:12px;
background:#f97316;
color:#fff;
border:none;
border-radius:10px;
font-size:15px;
font-weight:700;
cursor:pointer;

}

button:hover{

opacity:.9;

}

.error{

color:#dc2626;
font-size:13px;
text-align:center;
margin-top:10px;
font-weight:700;
display:none;

}

/* لوحة بعد تسجيل الدخول */

.dashboard{

display:none;
text-align:center;

}

.office-name{

font-size:19px;
font-weight:800;
color:#f97316;
margin-bottom:4px;

}

.welcome{

font-size:13px;
color:#555;
margin-bottom:20px;

}

.link-btn{

display:block;
width:100%;
padding:14px;
margin-top:12px;
background:#0f172a;
color:#fff;
border-radius:10px;
text-decoration:none;
font-weight:700;
font-size:14px;

}

.link-btn:hover{

opacity:.9;

}

.logout{

margin-top:18px;
background:transparent;
color:#dc2626;
border:1px solid #dc2626;
font-size:13px;
padding:8px;

}

</style>

</head>
<body>

<div class="box">

<div id="loginView">

<h1>🔐 تسجيل دخول الإدارة</h1>
<div class="hint">خاص بأصحاب المكاتب فقط</div>

<label>اسم المستخدم</label>
<input type="text" id="username" placeholder="اسم المستخدم">

<label>كلمة المرور</label>
<input type="password" id="password" placeholder="كلمة المرور (٦ أرقام)" maxlength="6" inputmode="numeric">

<button onclick="login()">دخول</button>

<div class="error" id="errorMsg">اسم المستخدم أو كلمة المرور غير صحيحة</div>

</div>

<div id="dashboardView" class="dashboard">

<div class="office-name" id="officeNameDisplay"></div>
<div class="welcome">مرحباً، اختر نوع العقد اللي تريد تسويه</div>

<a class="link-btn" href="https://shassiha.github.io/real-estate-contracts/" target="_blank">🏠 عقد بيع عقار</a>
<a class="link-btn" href="https://shassiha.github.io/car-sale-contract.html/" target="_blank">🚗 عقد بيع سيارة</a>

<button class="logout" onclick="logout()">تسجيل خروج</button>

</div>

</div>

<script>

// بيانات المكاتب - كل مكتب له يوزر وباسورد واسم يظهر بالعقود
// لإضافة مكتب جديد: أضف سطر جديد بنفس الشكل داخل هذا الكائن
const offices = {

"مكتب القدة": {
password: "112233",
officeName: "مكتب القدة العقاري"
}

};

// إذا مسجل دخول أصلاً، اعرض اللوحة مباشرة
window.onload = function(){

const savedOffice = localStorage.getItem("officeName");
const savedUser = localStorage.getItem("organizerName");

if(savedOffice && savedUser){
showDashboard(savedUser, savedOffice);
}

};

function login(){

const username = document.getElementById("username").value.trim();
const password = document.getElementById("password").value.trim();

const office = offices[username];

if(office && office.password === password){

localStorage.setItem("organizerName", username);
localStorage.setItem("officeName", office.officeName);

document.getElementById("errorMsg").style.display = "none";

showDashboard(username, office.officeName);

}else{

document.getElementById("errorMsg").style.display = "block";

}

}

function showDashboard(username, officeName){

document.getElementById("loginView").style.display = "none";
document.getElementById("dashboardView").style.display = "block";
document.getElementById("officeNameDisplay").innerText = officeName;

}

function logout(){

localStorage.removeItem("organizerName");
localStorage.removeItem("officeName");

document.getElementById("dashboardView").style.display = "none";
document.getElementById("loginView").style.display = "block";

document.getElementById("username").value = "";
document.getElementById("password").value = "";

}

</script>

</body>
</html>
